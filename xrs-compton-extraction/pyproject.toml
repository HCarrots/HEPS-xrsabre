[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrs-compton-extraction"
version = "0.1.0.dev0"
description = "Independent multi-q X-ray Raman scattering Compton-background extraction toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "XRS Compton Extraction contributors" },
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4.0",
  "pandas>=2.0",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6.0",
]
workbench = [
  "ipywidgets>=8.1",
  "jupyterlab>=4.0",
]
profiles = [
  "xraylib>=4.2,<5",
]
test = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xrs_compton_extraction = [
  "resources/**/*.yaml",
  "resources/**/*.json",
  "resources/**/*.csv",
  "resources/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["xrs_compton_extraction"]

[tool.coverage.report]
show_missing = true
skip_covered = true
